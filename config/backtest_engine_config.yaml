  #               （整个 `_score_stocks`/五维评分**不调用** ✓ ⇒ 回测更快 ✓；
  #                换来的代价 ✗：资金面/事件/基本面否决**全部失效** ✗ ⇒ 入池量显著变多 ✓）
  #   ⚠️ `direct` **只管入池** ✓ —— 买入前置过滤 / ADX 闸门 / **仓位上限** / 涨停板
  #      等闸门**照旧生效** ✓（未受影响 ✓）。
  pool_entry_mode: "direct"

# 买入股票池遍历顺序
# 0: 正序处理，老股票优先（默认行为，先加入池的股票优先买入）
# 1: 倒序处理，新加入股票优先（当日新选出的股票优先买入）
reverse_pool_order: 0

# 交易日历完整性校验（2026-09-25 新增）
# 背景：本地缓存 data/trading_calendar_cache.json 为"只增不减"的累积文件，
#       一旦并发写缩水/接口返回局部数据，区间会出现**局部缺日** ✗，
#       而此前判据只查"总天数占比 <80%"，抓不到局部空洞 → 残历照跑、结果静默偏差 ✗。
# 现行为：加载日历时用权威日历（akshare 全量，含节假日）逐日比对，
#       · 有缺失 → 自动补齐并原子写回缓存（日志 WARNING + 缺失清单）
#       · 补齐失败（权威源不可用）→ strict=true 时**直接终止回测**，避免产出错误结果
# 读取优先级：环境变量 KHUNTER_CALENDAR_STRICT(0/1) > 本配置节 > 默认 true
calendar:
  strict: true
  # 权威日历来源说明（当前仅支持 akshare 全量日历；不可用时退回 Tushare 区间数据）
  authority: akshare

# 股票池移除模式（pool_mode）
# persistent: 默认模式，仅按条件移除（破支撑位 / 趋势不达标 / 资金流向），股票池跨交易日累积
# rotation:   轮动模式，每日选股前把池中【非持仓】候选全部移出，仅保留当前持仓；
#             持仓候选仍按上述条件移除；随后选股把当日新选追加进池。
#             即每日可买池 = 已持仓 + 当日新选，历史老候选每日被轮出。
# 读取优先级：run_backtest 的 config 传入 > 本配置文件 > 默认 persistent
pool_mode: persistent

# 买入前涨停基因检测开关（BuyPreFilter 规则4）
# true(默认): 近30个交易日（不含当日）至少1次涨停(>9.5%)才允许买入，用于过滤非强势股
# false:      关闭该检测，候选通过率与成交率提升（代价：失去强势股过滤）
# 作用范围：回测引擎 + 实盘策略运行器（仅首仓），两处共用本开关，语义一致
# 读取优先级：run_backtest 的 config 传入 > 本配置文件 > 默认 true
# 当前值 false：关闭涨停基因检测，以提升候选通过率与成交率（代价：失去强势股过滤）
# 如需恢复：改为 true
enable_limit_up_check: false

# 股票池「入池规则」（回测 + 实盘共用）
# 统一规则：veto_flag == False 且 score >= score_threshold 才入池
# simplified: true  → 简易评分：先排除一票否决（事件/资金面/基本面），通过的只算
#                      【资金面得分】（资金面权重 100%）作为 score，
#                      资金面得分 >= score_threshold 才入池
#             false → 标准评分：五维度加权综合评分 >= score_threshold 才入池
# 注1：评分阈值来自 backtest_config.score_threshold（当前为 60）
# 注2：资金面一票否决由 MoneyflowScorer.check_veto 判定（calculate_score 内部先判否决、再打分）
pool_entry:
  simplified: true
  # auto_add_holdings: true → 持仓股（当日卖出不计）每日自动回到候选池，
  #                     使其可参与择时 add 判断（加仓）；false 则关闭
  auto_add_holdings: true

# 买入执行方式（回测 + 实盘共用本配置）
# 读取优先级：run_backtest 的 config['buy_execution'] > 本配置节 > 引擎内置默认值
# open:     回测=T日开盘价无条件成交（原行为，默认）；实盘=T日收盘价（原行为，默认）
# ma_limit: 以五日线为基准计算委托价（含滑点），即"五日线买入"
#           - 回测：MA5 截至 T-1（防前视：T-1信号、T日成交）；
#                   仅当 T 日最低价 <= 委托价 才成交（成交价 = min(开盘价, 委托价)）
#           - 实盘：MA5 截至 T 日收盘（T日盘后生成信号，含当日不构成前视）；
#                   仅生成委托价，不模拟是否成交（实际成交以 PTrade 反馈为准）
buy_execution:
  mode: open                    # open | ma_limit
  ma_period: 5                  # 委托价基准均线周期
  ma_source: close              # 均线计算所用价格字段
  ma_base: prev_day             # 均线基准日：prev_day=截至T-1（防前视）
  slippage: 0.005               # 滑点0.5%（买入取不利方向，即更贵）
  fill_price: better            # better=min(开盘价, 委托价) | limit=委托价
  min_periods: 5                # 均线有效所需最小样本数
  insufficient_data: fallback_open  # 样本不足时回退开盘价成交
  on_unfilled: keep             # 未成交时保留候选池

# ============================================
# 双边成交滑点（2026-09-23 新增）
# ============================================
# 口径：买入成交价 = 基准成交价 × (1 + buy)；卖出成交价 = 基准成交价 × (1 - sell)
#   买卖各 0.3% → 单次完整往返约 0.6% 成本（费用另计：佣金/印花/过户费）
# 读取优先级：回测请求 config['slippage'] > 本配置节 > 引擎内置默认(0.003/0.003)
# 关闭方式：把 buy / sell 都设为 0（用于复现历史回测结果）
# 注意：buy_execution.mode = ma_limit 时，其委托价自带 slippage，不再叠加本滑点（避免双计）
slippage:
  buy: 0.003
  sell: 0.003
