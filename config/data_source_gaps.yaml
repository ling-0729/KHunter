# 已知上游数据源缺口登记表（2026-09-25 建立）
#
# 用途：区分两类"缺日"，避免互相掩盖 ✗
#   ① **我方漏采** ✗  → 必须补采（`BaseCollector.repair_coverage` ✓），补不上就**失败** ✗
#   ② **上游源侧无数据** ✗ → 无法补采，登记在此 ✓（**显式**、带证据、可审计 ✓），
#      不再计入 `missing` ✗，但会在覆盖率报告里以 `known_gaps` **单独列出** ✓
#
# 原则：**登记 ≠ 忽略** ✓ —— 每一条都要有探测证据 ✓；新发现的缺口须先探测确认是
#       源侧问题，才允许登记 ✓（禁止为了"跑绿"直接登记 ✗）。
#
# 结构：
#   <采集器名>:            # 必须与 BaseCollector.name 完全一致 ✓
#     "YYYY-MM-DD":
#       reason: 原因（人读 ✓）
#       evidence: 探测证据（命令/结果 ✓）
#       verified_at: 探测日期

