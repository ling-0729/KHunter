strategies:
  BowlReboundStrategy:
    color: '#8b5cf6'
    description: 圆弧底（碗形反弹）：股价回落到短期趋势线与多空线之间（碗中），趋势未坏且处于低位
    display_name: 圆弧底
    icon: 🥣
    param_details:
      neck_lookback:
        default: 60
        description: 颈线取值窗口：近 N 日最高收盘价（真突破基准）
        display_name: 颈线窗口(日)
        group: 形态窗口
        max: 250
        min: 20
        type: int
      min_cycle_days:
        default: 30
        description: 圆弧最小周期（颈线距今至少多少个交易日）
        display_name: 圆弧最小周期(日)
        group: 形态窗口
        max: 120
        min: 10
        type: int
      bottom_min_days:
        default: 5
        description: 碗底最低点距今日的最少交易日（右侧回升段长度）
        display_name: 碗底起始(日)
        group: 形态窗口
        max: 60
        min: 0
        type: int
      min_bottom_days:
        default: 5
        description: 碗底平台期最少交易日数（排除尖底/V形）
        display_name: 碗底平台(日)
        group: 圆弧平滑
        max: 60
        min: 1
        type: int
      bottom_flat_tol_pct:
        default: 5.0
        description: 碗底"平"的容差（收盘 ≤ 碗底×(1+tol%)即视为在底部）
        display_name: 碗底容差(%)
        group: 圆弧平滑
        max: 20.0
        min: 1.0
        type: float
      min_curve_r2:
        default: 0.0
        description: 整段二次拟合 R² 下限（0=不限；圆度改由"分段 R²"判断）
        display_name: 整段R²下限
        group: 圆弧平滑
        max: 1.0
        min: 0.0
        type: float
      max_curve_r2:
        default: 0.0
        description: 整段二次拟合 R² 上限（0=不限）
        display_name: 整段R²上限
        group: 圆弧平滑
        max: 1.0
        min: 0.0
        type: float
      min_segment_r2:
        default: 0.6
        description: 【分段圆度】左段(颈线→碗底)/右段(碗底→今日) 各自拟合 R² 的下限（越大越平滑单调）
        display_name: 分段R²下限
        group: 圆弧平滑
        max: 1.0
        min: 0.0
        type: float
      max_segment_r2:
        default: 0.0
        description: 【分段圆度】左段/右段 各自拟合 R² 的上限（0=不限；一般无需限制）
        display_name: 分段R²上限
        group: 圆弧平滑
        max: 1.0
        min: 0.0
        type: float
      segment_r2_agg:
        default: both
        description: 两段R²的合并方式：both=两段都要满足 / min=取较小者 / mean=取均值
        display_name: 分段R²合并方式
        group: 圆弧平滑
        type: str
      max_daily_change_pct:
        default: 3.0
        description: 形态段内日均|涨跌幅|上限（%），排除陡V/暴涨暴跌
        display_name: 日均波动上限(%)
        group: 圆弧平滑
        max: 10.0
        min: 0.5
        type: float
      bottom_max_days:
        default: 30
        description: 碗底距今日的最多交易日
        display_name: 碗底结束(日)
        group: 形态窗口
        max: 120
        min: 5
        type: int
      breakout_max_pct:
        default: 5.0
        description: 突破幅度上限（%），收盘相对短期趋势线，防止追高
        display_name: 突破幅度上限(%)
        group: 突破条件
        max: 15.0
        min: 0.0
        type: float
      min_drop_pct:
        default: 8.0
        description: 颈线到碗底的最小回落幅度（%），碗深下限
        display_name: 碗深下限(%)
        group: 碗形条件
        max: 60.0
        min: 0.0
        type: float
      max_drop_pct:
        default: 60.0
        description: 颈线到碗底的最大回落幅度（%），碗深上限
        display_name: 碗深上限(%)
        group: 碗形条件
        max: 100.0
        min: 10.0
        type: float
      max_rise_from_bottom_pct:
        default: 30.0
        description: 碗底到今日的累计涨幅上限（%），涨幅过大即V形反弹非圆弧
        display_name: 底→今涨幅上限(%)
        group: 碗形条件
        max: 100.0
        min: 5.0
        type: float
      max_wave_pct:
        default: 10.0
        description: 形态段内允许的最大反向波动（反弹/回调，%）
        display_name: 最大反向波动(%)
        group: 圆弧平滑
        max: 50.0
        min: 1.0
        type: float
      max_slope_ratio:
        default: 0.02
        description: 归一化斜率(拟合斜率÷段内均价)上限，即"每日平均涨跌幅"，与股价水平无关；0=不限制
        display_name: 倾斜角度上限(/天)
        group: 圆弧平滑
        max: 0.2
        min: 0.0
        type: float
      lead_in_days:
        default: 20
        description: 反弹观察窗口向前延伸的交易日数（覆盖颈线之前，防"急涨冲高后见顶"）
        display_name: 颈线前延伸(日)
        group: 圆弧平滑
        max: 60
        min: 0
        type: int
      volume_ratio_min:
        default: 1.2
        description: 量比下限（当日量/均量），突破需放量确认
        display_name: 量比下限
        group: 量能条件
        max: 5.0
        min: 0.5
        type: float
      require_two_phase:
        default: true
        description: 要求前半段下跌、后半段上升（以碗底为界的两段结构）
        display_name: 两段结构(前跌后升)
        group: 圆弧平滑
        type: bool
      require_prev_below:
        default: true
        description: 要求前一日收盘仍在颈线下方（今日刚突破）
        display_name: 要求前一日在颈线下
        group: 突破条件
        type: bool
    params:
      bottom_flat_tol_pct: 5.0
      bottom_max_days: 60
      bottom_min_days: 5
      breakout_max_pct: 5.0
      enable_volume_filter: true
      neck_lookback: 60
      lead_in_days: 20
      max_daily_change_pct: 3.0
      max_drop_pct: 60.0
      max_rise_from_bottom_pct: 30.0
      max_slope_ratio: 0.02
      max_wave_pct: 10.0
      min_bottom_days: 5
      max_curve_r2: 0.0
      min_curve_r2: 0.0
      max_segment_r2: 0.0
      min_segment_r2: 0.6
      segment_r2_agg: both
      min_cycle_days: 30
      min_drop_pct: 8.0
      require_prev_below: true
      require_two_phase: true
      vol_avg_days: 5
      volume_ratio_min: 1.0
    support_method: low
  BottomTrendInflectionStrategy:
    color: '#10b981'
    description: 识别深度下跌后的底部反转拐点，通过深度下跌、MACD底背离、放量反弹的组合判断
    display_name: 底部趋势拐点
    icon: 🔻
    param_details:
      decline_threshold:
        default: 0.45
        description: 下跌幅度阈值，从最高点到最低点的下跌幅度
        display_name: 下跌幅度(%)
        group: 深度下跌条件
        max: 0.6
        min: 0.3
        type: float
      lookback_days:
        default: 120
        description: 回溯天数，用于寻找最高点和最低点
        display_name: 回溯天数
        group: 深度下跌条件
        max: 250
        min: 60
        type: int
      macd_divergence_days:
        default: 20
        description: MACD底背离时间窗口
        display_name: 底背离窗口
        group: MACD底背离条件
        max: 40
        min: 10
        type: int
      price_increase_threshold:
        default: 0.08
        description: 当日涨幅需要超过此值
        display_name: 涨幅阈值(%)
        group: 放量反弹条件
        max: 0.15
        min: 0.05
        type: float
      volume_ma_period:
        default: 10
        description: 成交量均值计算周期
        display_name: 成交量周期
        group: 放量反弹条件
        max: 20
        min: 5
        type: int
      volume_ratio_threshold:
        default: 2.5
        description: 当日成交量需要是成交量均值的此倍数以上
        display_name: 成交量倍数
        group: 放量反弹条件
        max: 5.0
        min: 1.5
        type: float
    param_groups:
    - description: 控制深度下跌判断的参数
      name: 深度下跌条件
    - description: 控制MACD底背离判断的参数
      name: MACD底背离条件
    - description: 控制放量反弹判断的参数
      name: 放量反弹条件
    params:
      decline_threshold: 0.45
      lookback_days: 120
      macd_divergence_days: 20
      price_increase_threshold: 0.08
      volume_ma_period: 10
      volume_ratio_threshold: 2.5
    support_method: ma20
  ContinuousRisingWithVolumeStrategyV2:
    color: '#8b5cf6'
    description: 识别4~5天连阳后出现倍量阳线（收盘>MA5），随后缩量调整3~4天，捕捉回调买点
    display_name: 连阳回调策略
    icon: 📈
    param_details:
      body_ratio_min:
        default: 0.01
        description: 阳线最小实体比例（收盘-开盘）/开盘价
        display_name: 阳线最小实体比例
        group: 形态参数
        max: 0.03
        min: 0.005
        type: float
      enable_ma_filter:
        default: true
        description: 是否启用均线多头过滤（MA5>MA10>MA20）
        display_name: 均线多头过滤
        group: 趋势参数
        type: bool
      key_day_offset_max:
        default: 4
        description: 关键日距今最大天数（交易日）
        display_name: 关键日最大距离(天)
        group: 关键日参数
        max: 7
        min: 3
        type: int
      key_day_offset_min:
        default: 3
        description: 关键日距今最小天数（交易日）
        display_name: 关键日最小距离(天)
        group: 关键日参数
        max: 5
        min: 2
        type: int
      key_day_rise_min:
        default: 0.07
        description: 倍量阳线最小涨幅
        display_name: 倍量阳线最小涨幅(%)
        group: 倍量参数
        max: 0.1
        min: 0.01
        type: float
      ma_period:
        default: 5
        description: 均线周期（关键日收盘需站上该均线）
        display_name: 均线周期
        group: 趋势参数
        max: 20
        min: 5
        type: int
      max_adjust_days:
        default: 4
        description: 缩量调整最大天数
        display_name: 缩量调整最大天数
        group: 调整参数
        max: 6
        min: 3
        type: int
      max_consecutive_阳:
        default: 5
        description: 最大连续阳线天数
        display_name: 最大连续阳线天数
        group: 连阳参数
        max: 8
        min: 3
        type: int
      max_rally_pct:
        default: 0.25
        description: 连续阳线期间最大累计涨幅
        display_name: 连阳最大累计涨幅
        group: 形态参数
        max: 0.35
        min: 0.1
        type: float
      min_adjust_days:
        default: 3
        description: 缩量调整最小天数
        display_name: 缩量调整最小天数
        group: 调整参数
        max: 6
        min: 3
        type: int
      min_consecutive_阳:
        default: 3
        description: 最小连续阳线天数
        display_name: 最小连续阳线天数
        group: 连阳参数
        max: 6
        min: 3
        type: int
      strategy_weight:
        default: 50
        description: 技术面评分权重
        display_name: 策略权重
        group: 评分参数
        max: null
        min: null
        type: int
      trend_lookback_days:
        default: 20
        description: 趋势判断天数
        display_name: 趋势判断天数
        group: 趋势参数
        max: 30
        min: 10
        type: int
      trend_r_squared_threshold:
        default: 0.3
        description: 趋势R²阈值（趋势稳定性）
        display_name: 趋势R²阈值
        group: 趋势参数
        max: 0.7
        min: 0.1
        type: float
      volume_multiplier:
        default: 2.2
        description: 倍量阈值（当日成交量/前五日平均成交量）
        display_name: 倍量阈值
        group: 成交量参数
        max: 3.0
        min: 1.5
        type: float
    param_groups:
    - description: 控制连续阳线判断的参数
      name: 连阳参数
    - description: 控制倍量阳线判断的参数
      name: 倍量参数
    - description: 控制关键日位置的参数
      name: 关键日参数
    - description: 控制成交量条件的参数
      name: 成交量参数
    - description: 控制缩量调整判断的参数
      name: 调整参数
    - description: 控制阳线形态的参数
      name: 形态参数
    - description: 控制趋势判断的参数
      name: 趋势参数
    params:
      body_ratio_min: 0.01
      enable_ma_filter: true
      key_day_offset_max: 4
      key_day_offset_min: 3
      key_day_rise_min: 0.07
      ma_period: 5
      max_adjust_days: 4
      max_consecutive_阳: 5
      max_rally_pct: 0.25
      min_adjust_days: 3
      min_consecutive_阳: 3
      strategy_weight: 50
      trend_lookback_days: 20
      trend_r_squared_threshold: 0.3
      volume_multiplier: 2.2
    support_method: key_open
  GoldenCrossNotGreenStrategy:
    color: '#10b981'
    description: 识别MACD水上金叉且绿柱数量不超过3根的买入信号，捕捉强势股回调后的启动机会
    display_name: 金叉不绿策略
    icon: G
    param_details:
      dea_above_zero:
        default: true
        description: DEA是否需要在零轴上方
        display_name: DEA零轴上方
        group: 策略参数
        type: bool
      dif_above_zero:
        default: true
        description: DIF是否需要在零轴上方
        display_name: DIF零轴上方
        group: 策略参数
        type: bool
      macd_fast:
        default: 12
        description: MACD短期EMA周期
        display_name: 短期周期
        group: MACD参数
        max: 20
        min: 5
        type: int
      macd_signal:
        default: 9
        description: MACD信号线周期
        display_name: 信号线周期
        group: MACD参数
        max: 20
        min: 5
        type: int
      macd_slow:
        default: 26
        description: MACD长期EMA周期
        display_name: 长期周期
        group: MACD参数
        max: 40
        min: 10
        type: int
      max_green_bars:
        default: 3
        description: 金叉前允许的最大绿柱数量
        display_name: 最大绿柱数
        group: 策略参数
        max: 5
        min: 1
        type: int
      strategy_weight:
        default: 60
        description: 策略权重（用于综合评分）
        display_name: 策略权重
        group: 评分参数
        max: 100
        min: 10
        type: int
    param_groups:
    - description: 控制MACD指标计算的参数
      name: MACD参数
    - description: 控制策略条件的参数
      name: 策略参数
    - description: 控制策略综合评分的参数
      name: 评分参数
    params:
      dea_above_zero: true
      dif_above_zero: true
      macd_fast: 12
      macd_signal: 9
      macd_slow: 26
      max_green_bars: 3
      strategy_weight: 60
    support_method: ma20
  GoldenTriangleStrategy:
    color: '#f59e0b'
    description: 识别5日、10日、20日均线形成的金三角形态，捕捉趋势启动信号
    display_name: 金三角策略
    icon: 📐
    param_details:
      ac_interval:
        default: 3
        description: A点到C点的最大间隔天数
        display_name: A-C间隔天数
        group: 形态参数
        max: 10
        min: 0
        type: int
      c_cross_min_gain:
        default: 0.01
        description: C点当天的最小涨幅(%)
        display_name: C点最小涨幅
        group: C点条件
        max: 0.1
        min: 0.0
        type: float
      c_cross_min_volume_ratio:
        default: 1.1
        description: C点当天的最小量能比(成交量/MA5成交量)
        display_name: C点最小量能比
        group: C点条件
        max: 3.0
        min: 0.5
        type: float
      long_period:
        default: 20
        description: 长期均线周期(MA20)
        display_name: 长期均线周期
        group: 均线参数
        max: 60
        min: 10
        type: int
      lookback_days:
        default: 30
        description: 回溯天数，用于寻找形态
        display_name: 回溯天数
        group: 形态参数
        max: 60
        min: 10
        type: int
      ma60_rise_required:
        default: true
        description: 是否要求60日均线向上（选股日MA60>前一交易日MA60），过滤趋势向下的股票
        display_name: 要求60日线向上
        group: 均线参数
        type: bool
      mid_period:
        default: 10
        description: 中期均线周期(MA10)
        display_name: 中期均线周期
        group: 均线参数
        max: 30
        min: 5
        type: int
      short_period:
        default: 5
        description: 短期均线周期(MA5)
        display_name: 短期均线周期
        group: 均线参数
        max: 20
        min: 3
        type: int
      strategy_weight:
        default: 50
        description: 策略权重
        display_name: 策略权重
        group: 权重参数
        max: 100
        min: 10
        type: int
      super_long_period:
        default: 60
        description: 超长期均线周期(MA60)
        display_name: 超长期均线周期
        group: 均线参数
        max: 120
        min: 40
        type: int
    param_groups:
    - description: 控制均线计算的参数
      name: 均线参数
    - description: 控制金三角形态识别的参数
      name: 形态参数
    - description: 控制C点条件的参数
      name: C点条件
    - description: 控制策略权重的参数
      name: 权重参数
    params:
      ac_interval: 6
      c_cross_min_gain: 0.01
      c_cross_min_volume_ratio: 1.1
      long_period: 20
      lookback_days: 30
      ma60_rise_required: true
      mid_period: 10
      short_period: 5
      strategy_weight: 50
      super_long_period: 60
    support_method: ma20
  ImmortalGuidanceStrategy:
    color: '#f59e0b'
    description: 识别仙人指路形态，通过冲高回落+长上影+放量+趋势向上的组合判断，筛选强势股回调买点
    display_name: 仙人指路策略
    icon: 🌟
    param_details:
      anti_body_ratio:
        default: 0.5
        description: 反包上影线比例
        display_name: 反包比例
        group: 反包参数
        max: 0.6
        min: 0.4
        type: float
      anti_body_window:
        default: 4
        description: 反包时间窗口(天)，且当天必须是反包日
        display_name: 反包窗口(天)
        group: 反包参数
        max: 5
        min: 1
        type: int
      ma_periods:
        default:
        - 5
        - 10
        - 20
        description: 均线周期列表
        display_name: 均线周期
        group: 均线参数
        max: null
        min: null
        type: list
      strategy_weight:
        default: 70
        description: 技术面评分权重
        display_name: 策略权重
        group: 评分参数
        max: null
        min: null
        type: int
      surge_threshold:
        default: 0.08
        description: 冲高幅度阈值（筛选更强势信号）
        display_name: 冲高幅度(%)
        group: 上影线参数
        max: 0.1
        min: 0.05
        type: float
      trend_lookback_days:
        default: 20
        description: 趋势判断天数
        display_name: 趋势天数
        group: 趋势参数
        max: 30
