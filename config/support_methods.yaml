# ============================================
# 策略支撑位计算方法配置
# ============================================
# 说明：定义每个策略使用的支撑位计算方法
# 支持的方法：ma20、key_close_5、key_open、key_close
# 默认方法：ma20

# 支撑位计算方法说明：
# - ma20: 使用 20 日均线作为支撑位
# - key_close_5: 使用关键日收盘价下跌 5% 作为支撑位
# - key_open: 使用关键日开盘价作为支撑位
# - key_close: 使用关键日收盘价作为支撑位

strategies:
  # 仙人指路策略
  ImmortalGuidanceStrategy:
    support_method: key_close_5
    description: 仙人指路形态，使用关键日收盘价下跌5%作为支撑位

  # 涨停回马枪策略
  LimitUpPullbackStrategy:
    support_method: key_close_5
    description: 涨停后回调再次上涨，使用关键日收盘价下跌5%作为支撑位

  # 多金叉共振策略
  MultiGoldenCrossStrategy:
    support_method: ma20
    description: 多指标金叉共振，使用20日均线作为支撑位

  # 多方炮策略
  MultiPartyCannonStrategy:
    support_method: key_open
    description: 两阳夹一阴形态，使用关键日开盘价作为支撑位

  # 阻力位突破策略
  ResistanceBreakoutStrategy:
    support_method: key_close_5
    description: 突破关键阻力位，使用关键日收盘价下跌5%作为支撑位

  # 主升低吸策略
  MainUptrendDipBuyStrategy:
    support_method: key_close_5
    description: 一拉二调后贴紧突破R，使用关键日收盘价下跌5%作为支撑位

  # 强势洗盘弱转强策略
  StrongWashWeakToStrongStrategy:
    support_method: key_close
    description: 放量洗盘后反包，使用关键日收盘价作为支撑位

  # 趋势加速拐点策略
  TrendAccelerationInflectionStrategy:
    support_method: key_close_5
    description: 上升趋势加速拐点，使用关键日收盘价下跌5%作为支撑位

  # W底策略
  WBottomStrategy:
    support_method: ma20
    description: W底双底反转形态，使用20日均线作为支撑位

  # 涨停横盘策略
  LimitUpSidewaysStrategy:
    support_method: key_close_5
    description: 涨停后横盘整理，使用关键日收盘价下跌5%作为支撑位

  # 启明星策略
  MorningStarStrategy:
    support_method: ma20
    description: 三根K线启明星形态，使用20日均线作为支撑位

  # 底部趋势拐点策略
  BottomTrendInflectionStrategy:
    support_method: ma20
    description: 深度下跌后底部反转，使用20日均线作为支撑位

  # 2560战法选股策略
  Strategy2560Selection:
    support_method: ma20
    description: 2560战法选股策略，使用20日均线作为支撑位

  # 趋势起点策略
  TrendStartStrategy:
    support_method: ma20
    description: 趋势起点策略，使用20日均线作为支撑位

  # 金叉不绿策略
  GoldenCrossNotGreenStrategy:
    support_method: ma20
    description: MACD水上金叉策略，使用20日均线作为支撑位

  # 金三角策略
  GoldenTriangleStrategy:
    support_method: ma20
    description: 金三角策略，使用20日均线作为支撑位

  # 超跌反弹策略
  #   ⚠️ 2026-09-19 对齐：原为 t_day_low，但 strategy_config_manager.VALID_SUPPORT_METHODS
  #   不含该方法（走该路径时实际得到 ma20），且 strategy_params.yaml 内同策略写 ma20
  #   → 两条链路结果不一致。此处统一为 ma20，消除口径冲突。
  OversoldReboundStrategy:
    support_method: ma20
    description: 超跌反弹策略，使用20日均线作为支撑位

  # 低位九转策略
  LowTD9Strategy:
    support_method: t_day_low
    description: 低位九转策略，使用T日（选股日）最低价作为支撑位

  # 龙头策略
  LeaderStrategy:
    support_method: key_open
    description: 龙头策略，使用关键日开盘价作为支撑位

  # 次新腰斩策略
  NewStockDrawdownStrategy:
    support_method: ma20
    description: 次新腰斩策略（上市以来K线≤120根+自最高价跌幅≥50%），使用20日均线作为支撑位

# 默认支撑位计算方法（当策略未配置时使用）
default_support_method: ma20

# 支撑位计算方法定义
support_methods:
  ma20:
    name: 20日均线
    description: 使用20日均线作为支撑位
    requires_key_date: false

  t_day_low:
    name: T日最低价
    description: 使用T日（选股日/selection_date当日）最低价作为支撑位
    requires_key_date: false
    
  key_close_5:
    name: 关键日收盘价-5%
    description: 使用关键日收盘价下跌5%作为支撑位
    requires_key_date: true
    
  key_open:
    name: 关键日开盘价
    description: 使用关键日开盘价作为支撑位
    requires_key_date: true
    
  key_close:
    name: 关键日收盘价
    description: 使用关键日收盘价作为支撑位
    requires_key_date: true
